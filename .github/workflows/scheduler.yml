# Calls the NEXORA scheduler every 5 minutes for cloud deployments without their own cron
# (Vercel Hobby only allows daily cron jobs). Self-hosted installs use the scheduler container in
# deploy/docker-compose.yml instead.
#
# Enable it: Settings → Secrets and variables → Actions → add
#   NEXORA_URL   https://your-nexora-host   (no trailing slash)
#   CRON_SECRET  the same value as on the server
# Without both secrets the job does nothing. GitHub may delay scheduled runs by a few minutes;
# VIGIL tolerates up to 15 minutes between heartbeats.
name: Scheduler

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call /api/cron/scheduler
        env:
          NEXORA_URL: ${{ secrets.NEXORA_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$NEXORA_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "NEXORA_URL or CRON_SECRET is not set; nothing to do."
            exit 0
          fi
          code=$(curl -sS -o response.json -w '%{http_code}' --max-time 60 -X POST -H "Authorization: Bearer $CRON_SECRET" "$NEXORA_URL/api/cron/scheduler")
          echo "HTTP $code"
          head -c 500 response.json; echo
          test "$code" = 200
